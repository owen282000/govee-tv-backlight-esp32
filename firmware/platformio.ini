; Build and flash over USB:   pio run -e esp32dev -t upload
; Serial console:             pio device monitor
; The release workflow sets FW_VERSION from the git tag.
[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DFW_VERSION=\"${sysenv.FW_VERSION}\"

; Any ESP32 dev board, strip data on GPIO 16.
[env:esp32dev]
build_flags =
  ${env.build_flags}
  -DSTRIP_PIN=16

; Gledopto GL-C-015WL-M (ESP32 WLED controller): output 1 (V / D / G) is
; GPIO 16, and GPIO 18 switches the power to the LED output.
[env:gledopto]
build_flags =
  ${env.build_flags}
  -DSTRIP_PIN=16
  -DRELAY_PIN=18
